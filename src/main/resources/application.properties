spring.application.name=sample-spring

# Local Keycloak instance, see integrations/keycloak/
spring.security.oauth2.client.registration.keycloak.client-id=sample-spring
spring.security.oauth2.client.registration.keycloak.client-secret=sample-spring-secret
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8091/realms/sample

# Local Postgres instance, see integrations/postgres/
spring.docker.compose.file=integrations/postgres/compose.yaml

# The schema is owned by Flyway, see db/migration/
spring.jpa.hibernate.ddl-auto=validate
